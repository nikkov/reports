name: check

# Проверки без e2e: e2e требуют живых сервисов и БД, их запуск — локально
# (REP_E2E=1 ./scripts/ci.sh) или отдельным стендом.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CONAN_USER_HOME: ${{ github.workspace }}/.conan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conan v1 и компилятор
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libpq-dev
          python -m pip install --upgrade pip
          pip install 'conan==1.66.0'
      - name: Кэш Conan
        uses: actions/cache@v4
        with:
          path: .conan
          key: conan-${{ runner.os }}-${{ hashFiles('backend/conanfile.txt', 'backend/conanfile.py') }}
      - name: Зависимости
        working-directory: backend
        run: conan install . -if build --build missing -s build_type=Release
      - name: Сборка
        working-directory: backend
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build"
          cmake --build build -j"$(nproc)"
      - name: ctest
        working-directory: backend/build
        run: ctest --output-on-failure

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Валидация шаблонов
        working-directory: frontend
        run: npm run --silent validate -- ../backend/templates/*.json
      - name: Юнит-тесты
        working-directory: frontend
        run: npx vitest run
      - name: Сборка
        working-directory: frontend
        run: npm run --silent build
