# Пример nginx для сервера отчётов под префиксом /reports (ADR-53).
# Фронтенд собирается один раз (./scripts/build.sh) и копируется сюда как есть:
# пути к ассетам относительные, адрес API вычисляется на клиенте из расположения
# приложения (/reports/api). Пересборка при переезде не нужна.
#
# Префикс снимается: наружу /reports/..., внутрь — корень статики и /api бэкенда.

# Режим REP_AUTH=proxy (ADR-54): прокси сам проверяет пользователя (basic, SSO, auth_request)
# и передаёт его имя приложению в заголовке X-Remote-User. Приложение доверяет заголовку
# только с адресов из REP_AUTH_PROXY_TRUSTED (по умолчанию 127.0.0.1, ::1).

server {
    listen 80;
    server_name reports.example.local;

    # пример простой проверки средствами nginx; $remote_user подставляется ниже
    auth_basic           "Сервер отчётов";
    auth_basic_user_file /etc/nginx/reports.htpasswd;

    # HTTPS — обязателен для эксплуатации (пункт про Secure cookie);
    # ниже оставлено место для редиректа с HTTP:
    # return 301 https://$host$request_uri;

    # статика фронтенда
    location /reports/ {
        alias /srv/reporting/frontend/dist/;
        index index.html;

        # многостраничное приложение: неизвестный путь отдаём каталогом
        try_files $uri $uri/ /reports/index.html;

        # ассеты с хэшем в имени можно кэшировать надолго
        location /reports/assets/ {
            alias /srv/reporting/frontend/dist/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API бэкенда: /reports/api/... → http://127.0.0.1:8080/api/...
    location /reports/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # имя пользователя, проверенного прокси; клиентский заголовок затирается
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # выгрузка больших .xlsx
    }

    # SSE «обновление по событию»: поток без буферизации
    location /reports/api/report/events {
        proxy_pass http://127.0.0.1:8080/api/report/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
